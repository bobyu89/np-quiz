name: 題庫驗證

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 檢查題庫一致性
        run: python3 tools/validate.py
      - name: 檢查 index.html 是否為最新建置
        run: python3 tools/build.py --check
