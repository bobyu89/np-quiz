<!-- 主題切換器 -->
<div id="theme-switcher">
  <div id="theme-menu">
    <button onclick="setTheme('')" class="theme-btn" data-theme="">⚡ 電光藍</button>
    <button onclick="setTheme('theme-forest')" class="theme-btn" data-theme="theme-forest">🌲 森林綠</button>
    <button onclick="setTheme('theme-white')" class="theme-btn" data-theme="theme-white">☀️ 純白色</button>
    <button onclick="setTheme('theme-nightnurse')" class="theme-btn" data-theme="theme-nightnurse">🕯️ 夜燈暖護</button>
    <button onclick="setTheme('theme-neon')" class="theme-btn" data-theme="theme-neon">🌆 霓虹電魂</button>
    <button onclick="setTheme('theme-wagashi')" class="theme-btn" data-theme="theme-wagashi">🍵 和風雅途</button>
    <button onclick="setTheme('theme-abyss')" class="theme-btn" data-theme="theme-abyss">🌊 深海靜謐</button>
  </div>
  <button id="theme-toggle-btn" onclick="toggleThemeMenu()" title="更換主題">
    🎨
  </button>
</div>
