<!-- 筆記本 -->
<div id="screen-notebook-screen" class="screen">
  <div style="width:100%;max-width:860px;padding:32px 20px">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <button class="btn btn-sm btn-secondary" onclick="showScreen('landing')">← 返回</button>
      <h2 class="screen-title" style="margin:0">📝 我的筆記</h2>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      <input id="notebook-search" type="text" placeholder="搜尋筆記內容或題號..."
        oninput="renderNotebook()"
        style="flex:1;min-width:180px;padding:8px 14px;border-radius:6px;border:1px solid var(--color-bg-border);
               background:var(--color-bg-overlay);color:var(--color-text-primary);font-size:13px;
               font-family:'Noto Sans TC',sans-serif">
      <select id="notebook-sort" onchange="renderNotebook()"
        style="padding:8px 12px;border-radius:6px;border:1px solid var(--color-bg-border);
               background:var(--color-bg-overlay);color:var(--color-text-primary);font-size:13px;
               font-family:'Noto Sans TC',sans-serif">
        <option value="newest">最新優先</option>
        <option value="oldest">最舊優先</option>
        <option value="qid">依題號</option>
      </select>
      <span id="notebook-count" style="font-size:12px;color:var(--color-text-muted)"></span>
    </div>
    <div id="notebook-list"></div>
    <div id="notebook-empty" style="display:none;text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">📝</div>
      <div style="font-size:15px;color:var(--color-text-secondary);margin-bottom:8px">還沒有筆記</div>
      <div style="font-size:13px;color:var(--color-text-muted);line-height:1.6">
        在刷題時點擊「📝 筆記」按鈕<br>就可以為每道題目記下你的心得與重點<br>
        支援 Markdown 格式，筆記自動儲存在本機
      </div>
    </div>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--color-bg-border);display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-sm btn-secondary" onclick="exportNotes()">💾 匯出筆記</button>
      <button class="btn btn-sm btn-secondary" onclick="document.getElementById('import-notes-input').click()">📂 匯入筆記</button>
      <input type="file" id="import-notes-input" accept=".json" style="display:none" onchange="importNotes(event)">
    </div>

    <!-- Markdown 格式小提示 -->
    <details style="margin-top:20px">
      <summary style="cursor:pointer;font-size:12px;color:var(--color-text-muted);user-select:none;text-align:center">
        ℹ️ Markdown 格式小提示
      </summary>
      <div style="margin-top:12px;background:var(--gradient-card);box-shadow:var(--pixel-border-dark);border-radius:8px;padding:16px 20px;font-size:12px;color:var(--color-text-secondary);line-height:2">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px">
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">**粗體**</code> → <strong>粗體</strong></div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">*斜體*</code> → <em>斜體</em></div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">~~刪除線~~</code> → <del>刪除線</del></div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">`行內程式碼`</code> → <code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300)">行內程式碼</code></div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">- 項目</code> → 無序列表</div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">1. 項目</code> → 有序列表</div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">> 引用</code> → 引用區塊</div>
          <div><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">### 標題</code> → 三級標題</div>
          <div style="grid-column:1/-1"><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">| 欄A | 欄B |</code> + 第二行 <code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">|---|---|</code> → 表格</div>
          <div style="grid-column:1/-1"><code style="background:var(--color-bg-overlay);padding:1px 5px;border-radius:3px;color:var(--color-secondary-300);font-family:'Share Tech Mono',monospace">---</code> → 分隔線</div>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--color-text-muted)">
          小技巧：可以用表格整理易混淆的比較重點，用粗體標記關鍵數值，用引用區塊標記口訣
        </div>
      </div>
    </details>
  </div>
</div>
